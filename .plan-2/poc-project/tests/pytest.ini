[tool:pytest]
# Pytest configuration for POC testing framework

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*

# Async support
asyncio_mode = auto

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require browser/external services)
    performance: Performance tests (timing sensitive)
    e2e: End-to-end tests (full workflow)
    slow: Slow running tests (> 30 seconds)
    browser: Tests requiring browser automation
    llm: Tests requiring LLM integration
    smoke: Smoke tests (basic functionality)
    regression: Regression tests
    security: Security-related tests
    api: API tests
    ui: User interface tests
    data: Data validation tests
    edge_case: Edge case and boundary tests
    load: Load testing scenarios

# Output options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --verbose
    --color=yes
    --durations=10
    --maxfail=5

# Test timeout (in seconds)
timeout = 300

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:playwright.*
    ignore::UserWarning:selenium.*

# Minimum version
minversion = 6.0

# Console output format
console_output_style = progress

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=80

# Test ordering (if pytest-order is installed)
# order_dependencies = true

# Xdist parallel execution (if pytest-xdist is installed)
# addopts = -n auto

# Rerun failed tests (if pytest-rerunfailures is installed)
# addopts = --reruns 2 --reruns-delay 1